name: trucheman

services:
  app:
    image: ghcr.io/ferruman/trucheman:${TRUCHEMAN_IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRUCHEMAN_HTTP_PORT:-4173}:4173"
    environment:
      TRUCHEMAN_HOST: 0.0.0.0
      TRUCHEMAN_PORT: 4173
      TRUCHEMAN_DATA_DIR: /app/data
      TRUCHEMAN_SECRETS_FILE: /run/secrets/trucheman_env
    secrets:
      - trucheman_env
    volumes:
      - trucheman-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  trucheman_env:
    file: ./.env

volumes:
  trucheman-data:
