name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/ferruman/Trucheman/security/advisories/new
    about: Send security reports privately, never through a public issue.
